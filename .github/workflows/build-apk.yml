name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Ensure Web Directory Exists for Capacitor
        run: |
          mkdir -p .output/public
          if [ -d "dist/client" ]; then cp -r dist/client/* .output/public/; fi
          if [ -d "dist" ] && [ ! -d "dist/client" ]; then cp -r dist/* .output/public/; fi

      - name: Add Android Platform
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi

      - name: Generate App Icons and Splash Screens
        run: npx @capacitor/assets generate --android --assetPath resources || true

      - name: Sync Native Project
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-memory-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
